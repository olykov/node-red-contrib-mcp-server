<script type="text/javascript">
(function() {
    // properties.md: validators read the edit dialog first and fall back to the saved node.
    function mcpRedisMode(node) {
        var input = $('#node-config-input-mode');
        return input.length ? input.val() : node.mode;
    }
    function mcpAuthProvider(node) {
        var input = $('#node-config-input-provider');
        return input.length && input.val() ? input.val() : node.provider;
    }

    RED.nodes.registerType('nr-mcp-auth-storage', {
        category: 'config',
        defaults: {
            name: { value: '' },
            mode: { value: 'memory', required: true, validate: function(v) { return ['memory', 'env', 'manual'].indexOf(v) !== -1; } },
            redisUrlEnv: { value: 'MCP_REDIS_URL', validate: function(v) {
                return mcpRedisMode(this) !== 'env' || /^MCP_[A-Z0-9_]+$/.test(v || '');
            } },
            host: { value: '127.0.0.1', validate: function(v) { return mcpRedisMode(this) !== 'manual' || !!(v && String(v).trim()); } },
            port: { value: 6379, validate: function(v) {
                return v === '' || (RED.validators.number()(v) && Number.isInteger(Number(v)) && v > 0 && v < 65536);
            } },
            db: { value: 0, validate: function(v) {
                return v === '' || (RED.validators.number()(v) && Number.isInteger(Number(v)) && v >= 0);
            } },
            tls: { value: false },
            username: { value: '' },
            passwordEnv: { value: '', validate: function(v) { return !v || /^MCP_[A-Z0-9_]+$/.test(v); } },
            keyPrefix: { value: 'mcp_auth:' }
        },
        credentials: {
            password: { type: 'password' }
        },
        paletteLabel: 'MCP Auth Storage',
        label: function() {
            return this.name || this._('nr-mcp-auth-storage.label.paletteLabel');
        },
        oneditprepare: function() {
            function updateMode() {
                var mode = $('#node-config-input-mode').val();
                $('.mcp-redis-env-row').toggle(mode === 'env');
                $('.mcp-redis-manual-row').toggle(mode === 'manual');
                $('.mcp-redis-memory-note').toggle(mode === 'memory');
            }
            $('#node-config-input-mode').on('change', updateMode);
            updateMode();
        }
    });

    RED.nodes.registerType('nr-mcp-auth', {
        category: 'config',
        defaults: {
            name: { value: '' },
            oauthSlug: { value: '', required: true, validate: function(v) { return typeof v === 'string' && /^[a-z][a-z0-9-]{0,62}$/.test(v); } },
            provider: { value: 'oidc', required: true, validate: function(v) { return v === 'oidc' || v === 'microsoft'; } },
            issuerUrl: { value: '', validate: function(v) {
                if (mcpAuthProvider(this) !== 'oidc') return true;
                try { var u = new URL(v); return u.protocol === 'https:' && !u.username && !u.password && !u.search && !u.hash; }
                catch (_) { return false; }
            } },
            clientId: { value: '', validate: function(v) { return mcpAuthProvider(this) !== 'oidc' || (typeof v === 'string' && v.trim().length > 0); } },
            clientSecretEnv: { value: '', validate: function(v) {
                return mcpAuthProvider(this) !== 'oidc' || !v || /^MCP_[A-Z0-9_]+$/.test(v);
            } },
            microsoftTenantId: { value: '', validate: function(v) { return mcpAuthProvider(this) !== 'microsoft' || /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v); } },
            microsoftClientId: { value: '', validate: function(v) { return mcpAuthProvider(this) !== 'microsoft' || /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v); } },
            microsoftClientSecretEnv: { value: '', validate: function(v) {
                return mcpAuthProvider(this) !== 'microsoft' || !v || /^MCP_[A-Z0-9_]+$/.test(v);
            } },
            allowedClientHosts: { value: '', required: true },
            groupClaim: { value: 'groups' },
            userClaim: { value: 'email' },
            redis: { value: '', type: 'nr-mcp-auth-storage', required: true },
            accessTokenTtl: { value: 900, validate: function(v) { return Number.isInteger(Number(v)) && v > 0 && v <= 900; } },
            refreshTokenTtl: { value: 604800, validate: function(v) { return Number.isInteger(Number(v)) && v > 0 && v <= 604800; } },
            sessionTtl: { value: 1814400, validate: function(v) { return Number.isInteger(Number(v)) && v > 0 && v <= 1814400; } }
        },
        credentials: {
            clientSecret: { type: 'password' },
            microsoftClientSecret: { type: 'password' },
            oidcRefreshKey: { type: 'password' },
            microsoftRefreshKey: { type: 'password' }
        },
        paletteLabel: 'MCP Auth',
        label: function() {
            return this.name || this._('nr-mcp-auth.label.defaultLabel');
        },
        oneditprepare: function() {
            var node = this;
            var tabs = RED.tabs.create({
                id: 'mcp-auth-provider-tabs',
                onchange: function(tab) {
                    $('#node-config-input-provider').val(tab.id);
                    $('.mcp-auth-provider-panel').hide();
                    $('#mcp-auth-' + tab.id).show();
                }
            });
            tabs.addTab({ id: 'microsoft', label: node._('nr-mcp-auth.label.tabMicrosoft') });
            tabs.addTab({ id: 'oidc', label: node._('nr-mcp-auth.label.tabOidc') });
            tabs.activateTab(this.provider || 'oidc');

            function updateRedirectUrl() {
                var slug = $('#node-config-input-oauthSlug').val();
                var text = /^[a-z][a-z0-9-]{0,62}$/.test(slug || '') ?
                    node._('nr-mcp-auth.label.redirectUrlAvailable', { slug: slug }) :
                    node._('nr-mcp-auth.label.redirectUrlUnavailable');
                $('#mcp-auth-redirect-url').text(text);
            }
            $('#node-config-input-oauthSlug').on('input', updateRedirectUrl);
            updateRedirectUrl();
        }
    });
})();
</script>

    </div>
    <div class="form-row mcp-redis-manual-row">
        <label for="node-config-input-db"><i class="fa fa-list-ol"></i> <span data-i18n="nr-mcp-auth-storage.label.db"></span></label>
        <input type="text" id="node-config-input-db" data-i18n="[placeholder]nr-mcp-auth-storage.label.dbPlaceholder">
    </div>
    <div class="form-row mcp-redis-manual-row">
        <label for="node-config-input-tls"><i class="fa fa-lock"></i> <span data-i18n="nr-mcp-auth-storage.label.tls"></span></label>
        <input type="checkbox" id="node-config-input-tls" style="width: auto;">

    <div class="form-row mcp-redis-manual-row">
        <label for="node-config-input-username"><i class="fa fa-user"></i> <span data-i18n="nr-mcp-auth-storage.label.username"></span></label>

    <div class="form-row mcp-redis-manual-row">
        <label for="node-config-input-password"><i class="fa fa-key"></i> <span data-i18n="nr-mcp-auth-storage.label.password"></span></label>
        <input type="password" id="node-config-input-password" autocomplete="off">
    </div>
    <div class="form-row mcp-redis-manual-row">
        <label for="node-config-input-passwordEnv"><i class="fa fa-terminal"></i> <span data-i18n="nr-mcp-auth-storage.label.passwordEnv"></span></label>
        <input type="text" id="node-config-input-passwordEnv" data-i18n="[placeholder]nr-mcp-auth-storage.label.passwordEnvPlaceholder">
    </div>
    <div class="form-row">
        <label for="node-config-input-keyPrefix"><i class="fa fa-key"></i> <span data-i18n="nr-mcp-auth-storage.label.keyPrefix"></span></label>
        <input type="text" id="node-config-input-keyPrefix" data-i18n="[placeholder]nr-mcp-auth-storage.label.keyPrefixPlaceholder">
    </div>
</script>

    <div class="form-row">
