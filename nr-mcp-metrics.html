<script type="text/javascript">
    RED.nodes.registerType('nr-mcp-metrics', {
        category: 'mcp',
        color: '#87A980',
        defaults: {
            name: { value: '' },
            runtime: { value: '', type: 'nr-mcp-runtime', required: true }
        },
        inputs: 0,
        outputs: 1,
        paletteLabel: 'MCP Metrics',
        outputLabels: 'Tool telemetry',
        icon: 'font-awesome/fa-line-chart',
        label: function() {
            return this.name || this._('nr-mcp-metrics.label.name');
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        }
    });
</script>

<script type="text/html" data-template-name="nr-mcp-metrics">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="nr-mcp-metrics.label.nameField"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]nr-mcp-metrics.label.namePlaceholder">
    </div>
    <div class="form-row">
        <label for="node-input-runtime"><i class="fa fa-sitemap"></i> <span data-i18n="nr-mcp-metrics.label.runtime"></span></label>
        <input type="text" id="node-input-runtime">
    </div>
</script>
