<script type="text/javascript">
    RED.nodes.registerType('mcp-tool-registry', {
        category: 'mcp',
        color: '#E91E63',
        defaults: {
            name: { value: '' },
            toolName: { value: '', required: true },
            toolDescription: { value: '' },
            endpoint: {
                value: '',
                required: true,
                validate: function(value) {
                    return value === '__shared__' || Boolean(value);
                }
            },
            requiredScopes: { value: '' },
            toolSchema: { value: '{\n  "type": "object",\n  "properties": {},\n  "required": []\n}' },
            outputSchema: { value: '' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-plus',
        label: function() {
            return this.name || this.toolName || 'Tool Registry';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            var endpointSelect = $('#node-input-endpoint');
            var currentEndpoint = this.endpoint || '';
            endpointSelect.empty();
            endpointSelect.append($('<option></option>').attr('value', '').text('Select MCP endpoint...'));
            endpointSelect.append($('<option></option>').attr('value', '__shared__').text('Shared (All MCPs)'));
            if (RED.nodes && typeof RED.nodes.eachNode === 'function') {
                RED.nodes.eachNode(function(node) {
                    if (node.type !== 'mcp-flow-server') return;
                    var label = node.name || node.serverName || node.id;
                    endpointSelect.append($('<option></option>').attr('value', node.id).text(label));
                });
            }
            endpointSelect.val(currentEndpoint);

            $('#node-input-name').on('input', function() {
                var name = $(this).val();
                if (name && !$('#node-input-toolName').val()) {
                    var toolName = name.toLowerCase()
                        .replace(/[^a-z0-9\s]/g, '')
                        .replace(/\s+/g, '_');
                    $('#node-input-toolName').val(toolName);
                }
            });

            function validateSchemaField(selector, validationSelector, allowEmpty) {
                var schema = $(selector).val();
                if (allowEmpty && !schema.trim()) {
                    $(selector).removeClass('input-error');
                    $(validationSelector).hide();
                    return;
                }
                try {
                    var parsed = JSON.parse(schema);
                    $(selector).removeClass('input-error');
                    $(validationSelector).hide();
                    if (!parsed.type || !parsed.properties) {
                        $(validationSelector).show().css('color', '#f39c12').text("Warning: schema should have 'type' and 'properties' fields");
                    }
                } catch (error) {
                    $(selector).addClass('input-error');
                    $(validationSelector).show().css('color', '#e74c3c').text('Invalid JSON: ' + error.message);
                }
            }

            $('#node-input-toolSchema').on('blur', function() {
                validateSchemaField('#node-input-toolSchema', '#schema-validation', false);
            });

            $('#node-input-outputSchema').on('blur', function() {
                validateSchemaField('#node-input-outputSchema', '#output-schema-validation', true);
            });

            function formatJsonField(selector, label, allowEmpty) {
                var schema = $(selector).val();
                if (allowEmpty && !schema.trim()) return true;
                try {
                    $(selector).val(JSON.stringify(JSON.parse(schema), null, 2));
                    return true;
                } catch (error) {
                    RED.notify(label + ' invalid JSON: ' + error.message, 'error');
                    return false;
                }
            }

            $('#format-json-fields-btn').click(function() {
                var inputOk = formatJsonField('#node-input-toolSchema', 'Input schema', false);
                var outputOk = formatJsonField('#node-input-outputSchema', 'Output schema', true);
                if (inputOk && outputOk) RED.notify('JSON fields formatted', 'success');
            });

            $('#node-input-toolName').on('input', function() {
                var toolName = $(this).val();
                var isValid = /^[a-z][a-z0-9_]*$/.test(toolName);
                if (toolName && !isValid) {
                    $(this).addClass('input-error');
                    $('#tool-name-validation').show().text('Tool name must use lowercase letters, numbers, and underscores.');
                } else {
                    $(this).removeClass('input-error');
                    $('#tool-name-validation').hide();
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="mcp-tool-registry">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Display Name</label>
        <input type="text" id="node-input-name" placeholder="Human-readable tool name">
    </div>

    <div class="form-row">
        <label for="node-input-toolName"><i class="fa fa-cog"></i> Tool Name</label>
        <input type="text" id="node-input-toolName" placeholder="my_custom_tool">
        <div id="tool-name-validation" class="mcp-validation"></div>
    </div>

    <div class="form-row">
        <label for="node-input-toolDescription"><i class="fa fa-info-circle"></i> Tool Description</label>
        <textarea id="node-input-toolDescription" rows="2" placeholder="Describe what this tool does"></textarea>
        <div class="mcp-help-text">Shown to MCP clients and models in the tool descriptor.</div>
    </div>

    <div class="form-row">
        <label for="node-input-endpoint"><i class="fa fa-sitemap"></i> Endpoint</label>
        <select id="node-input-endpoint"></select>
        <div class="mcp-help-text">Choose a specific endpoint, or explicitly choose Shared only for tools intended to be available on every MCP endpoint.</div>
    </div>

    <div class="form-row">
        <label for="node-input-requiredScopes"><i class="fa fa-lock"></i> Required Scopes</label>
        <input type="text" id="node-input-requiredScopes" placeholder="resource:read">
        <div class="mcp-help-text">Optional extra OAuth scopes for this tool. Leave empty unless this tool needs stricter access than its endpoint.</div>
    </div>

    <hr>
    <h4>Parameter Schema</h4>

    <div class="form-row">
        <label for="node-input-toolSchema"><i class="fa fa-code"></i> JSON Schema</label>
        <textarea id="node-input-toolSchema" rows="8" placeholder='{"type": "object", "properties": {}, "required": []}'></textarea>
        <div id="schema-validation" class="mcp-validation"></div>
    </div>

    <hr>
    <h4>Output Schema</h4>

    <div class="form-row">
        <label for="node-input-outputSchema"><i class="fa fa-code"></i> Output Schema</label>
        <textarea id="node-input-outputSchema" rows="8" placeholder='{"type": "object", "properties": {}}'></textarea>
        <div class="mcp-help-text">Optional JSON Schema for structured tool results.</div>
        <div id="output-schema-validation" class="mcp-validation"></div>
    </div>

    <hr>
    <h4>Editor Utilities</h4>

    <div class="form-row">
        <label></label>
        <button type="button" id="format-json-fields-btn" class="btn btn-secondary">
            <i class="fa fa-magic"></i> Format JSON Fields
        </button>
        <div class="mcp-help-text">Formats Input Schema and Output Schema. Empty Output Schema is allowed.</div>
    </div>

    <div class="form-row">
        <label></label>
        <div class="mcp-help-text">Tools currently register automatically on start and deploy.</div>
    </div>

    <style>
        .mcp-help-text {
            margin-top: 5px;
            font-size: 12px;
            color: var(--red-ui-secondary-text-color, #666);
        }
        .mcp-validation {
            display: none;
            margin-top: 5px;
            font-size: 12px;
        }
        .mcp-button-row {
            margin-top: 5px;
        }
    </style>
</script>

<script type="text/html" data-help-name="mcp-tool-registry">
    <p>Defines and registers an MCP tool for one endpoint or every endpoint.</p>
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Tool Name <span class="property-type">string</span></dt>
        <dd>MCP tool name. Use lowercase letters, numbers, and underscores.</dd>
        <dt>Endpoint <span class="property-type">mcp-flow-server</span></dt>
        <dd>Required endpoint binding. Choose <code>Shared (All MCPs)</code> only for tools intentionally exposed on every endpoint.</dd>
        <dt>Required Scopes <span class="property-type">string</span></dt>
        <dd>Optional extra OAuth scopes added to this tool descriptor and enforced for tool listing and calls.</dd>
        <dt>JSON Schema <span class="property-type">JSON</span></dt>
        <dd>JSON Schema defining the tool input parameters.</dd>
        <dt>Output Schema <span class="property-type">JSON</span></dt>
        <dd>Optional JSON Schema defining the structured tool result.</dd>
    </dl>
    <h3>Runtime</h3>
    <p>The registry node advertises the tool automatically on start and deploy. The flow still has to return a matching <code>mcp-tool-response</code> for calls to complete.</p>
</script>
