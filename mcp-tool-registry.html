<script type="text/javascript">
    RED.nodes.registerType('mcp-tool-registry', {
        category: 'mcp',
        color: '#E6E0F8',
        defaults: {
            name: { value: '' },
            toolName: { value: '', required: true, validate: RED.validators.regex(/^[a-z][a-z0-9_]*$/) },
            toolDescription: { value: '' },
            endpoint: {
                value: '',
                required: true,
                validate: function(value) {
                    if (value === '__shared__') return true;
                    if (!value || value.charAt(0) !== '/') return false;
                    var found = false;
                    RED.nodes.eachNode(function(node) {
                        if (node.type === 'mcp-flow-server' && (node.serverPath || '/mcp') === value) found = true;
                    });
                    return found;
                }
            },
            toolBehavior: { value: '' },
            worldAccess: { value: '' },
            toolSchema: { value: '{\n  "type": "object",\n  "properties": {},\n  "required": []\n}', validate: function(v) {
                try { var parsed = JSON.parse(v); return !!parsed && typeof parsed === 'object' && !Array.isArray(parsed); }
                catch (_) { return false; }
            } },
            outputSchema: { value: '', validate: function(v) {
                if (!v || !String(v).trim()) return true;
                try { var parsed = JSON.parse(v); return !!parsed && typeof parsed === 'object' && !Array.isArray(parsed); }
                catch (_) { return false; }
            } },
        },
        inputs: 0,
        outputs: 0,
        paletteLabel: 'MCP tool',
        icon: 'font-awesome/fa-wrench',
        label: function() {
            return this.name || this.toolName || 'Tool Registry';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            var endpointSelect = $('#node-input-endpoint');
            var currentEndpoint = this.endpoint || '';
            endpointSelect.empty();
            endpointSelect.append($('<option></option>').attr('value', '').text('Select MCP endpoint...'));
            endpointSelect.append($('<option></option>').attr('value', '__shared__').text('Shared (All MCPs)'));
            if (RED.nodes && typeof RED.nodes.eachNode === 'function') {
                RED.nodes.eachNode(function(node) {
                    if (node.type !== 'mcp-flow-server') return;
                    var path = node.serverPath || '/mcp';
                    var label = (node.name || node.serverName || path) + ' (' + path + ')';
                    endpointSelect.append($('<option></option>').attr('value', path).text(label));
                });
            }
            endpointSelect.val(currentEndpoint);

            $('#node-input-name').on('input', function() {
                var name = $(this).val();
                if (name && !$('#node-input-toolName').val()) {
                    var toolName = name.toLowerCase()
                        .replace(/[^a-z0-9\s]/g, '')
                        .replace(/\s+/g, '_');
                    $('#node-input-toolName').val(toolName);
                }
            });

            function validateSchemaField(selector, validationSelector, allowEmpty) {
                var schema = $(selector).val();
                if (allowEmpty && !schema.trim()) {
                    $(selector).removeClass('input-error');
                    $(validationSelector).hide();
                    return;
                }
                try {
                    var parsed = JSON.parse(schema);
                    $(selector).removeClass('input-error');
                    $(validationSelector).hide();
                    if (!parsed.type || !parsed.properties) {
                        $(validationSelector).show().css('color', 'var(--red-ui-text-color-warning, #c38916)').text("Warning: schema should have 'type' and 'properties' fields");
                    }
                } catch (error) {
                    $(selector).addClass('input-error');
                    $(validationSelector).show().css('color', 'var(--red-ui-text-color-error, #d6615f)').text('Invalid JSON: ' + error.message);
                }
            }

            $('#node-input-toolSchema').on('blur', function() {
                validateSchemaField('#node-input-toolSchema', '#schema-validation', false);
            });

            $('#node-input-outputSchema').on('blur', function() {
                validateSchemaField('#node-input-outputSchema', '#output-schema-validation', true);
            });

            function formatJsonField(selector, label, allowEmpty) {
                var schema = $(selector).val();
                if (allowEmpty && !schema.trim()) return true;
                try {
                    $(selector).val(JSON.stringify(JSON.parse(schema), null, 2));
                    return true;
                } catch (error) {
                    RED.notify(label + ' invalid JSON: ' + error.message, 'error');
                    return false;
                }
            }

            $('#format-json-fields-btn').on('click', function() {
                var inputOk = formatJsonField('#node-input-toolSchema', 'Input schema', false);
                var outputOk = formatJsonField('#node-input-outputSchema', 'Output schema', true);
                if (inputOk && outputOk) RED.notify('JSON fields formatted', 'success');
            });

            $('#node-input-toolName').on('input', function() {
                var toolName = $(this).val();
                var isValid = /^[a-z][a-z0-9_]*$/.test(toolName);
                if (toolName && !isValid) {
                    $(this).addClass('input-error');
                    $('#tool-name-validation').show().text('Tool name must use lowercase letters, numbers, and underscores.');
                } else {
                    $(this).removeClass('input-error');
                    $('#tool-name-validation').hide();
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="mcp-tool-registry">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Human-readable tool name">
    </div>

    <div class="form-row">
        <label for="node-input-toolName"><i class="fa fa-cog"></i> Tool Name</label>
        <input type="text" id="node-input-toolName" placeholder="my_custom_tool">
        <div id="tool-name-validation" class="mcp-tool-registry-validation"></div>
    </div>

    <div class="form-row">
        <label for="node-input-toolDescription"><i class="fa fa-info-circle"></i> Description</label>
        <textarea id="node-input-toolDescription" rows="4" style="width: 70%; resize: vertical;" placeholder="Describe what this tool does"></textarea>
    </div>

    <div class="form-row">
        <label for="node-input-endpoint"><i class="fa fa-sitemap"></i> Endpoint</label>
        <select id="node-input-endpoint" style="width: 70%;"></select>
    </div>

    <hr>
    <h4>Annotations</h4>

    <div class="form-row">
        <label for="node-input-toolBehavior"><i class="fa fa-shield"></i> Behavior</label>
        <select id="node-input-toolBehavior" style="width: 70%;">
            <option value="">Unspecified</option>
            <option value="read">Read only</option>
            <option value="write">Add only</option>
            <option value="destructive">Change / Delete / Send</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-worldAccess"><i class="fa fa-globe"></i> Scope</label>
        <select id="node-input-worldAccess" style="width: 70%;">
            <option value="">Unspecified</option>
            <option value="closed">Fixed target</option>
            <option value="open">Open-ended</option>
        </select>
    </div>

    <div class="form-row">
        <label for="node-input-toolSchema" style="display: block; width: auto;"><i class="fa fa-code"></i> Input Schema</label>
        <textarea id="node-input-toolSchema" rows="12" style="display: block; width: 100%; resize: vertical; font-family: monospace;" placeholder='{"type": "object", "properties": {}, "required": []}'></textarea>
        <div id="schema-validation" class="mcp-tool-registry-validation"></div>
    </div>

    <div class="form-row">
        <label for="node-input-outputSchema" style="display: block; width: auto;"><i class="fa fa-code"></i> Output Schema</label>
        <textarea id="node-input-outputSchema" rows="12" style="display: block; width: 100%; resize: vertical; font-family: monospace;" placeholder='{"type": "object", "properties": {}}'></textarea>
        <div id="output-schema-validation" class="mcp-tool-registry-validation"></div>
    </div>

    <div class="form-row">
        <label></label>
        <button type="button" id="format-json-fields-btn" class="red-ui-button">
            <i class="fa fa-magic"></i> Format JSON Fields
        </button>
    </div>

    <style>
        .mcp-tool-registry-validation {
            display: none;
            margin-top: 5px;
            font-size: 12px;
        }
    </style>
</script>

<script type="text/html" data-help-name="mcp-tool-registry">
    <p>Registers one MCP tool for one endpoint or for every endpoint.</p>
    <h3>Details</h3>
    <p>The tool is advertised when the flow starts and removed when the node stops. Calls reach the
    selected MCP Flow Server output as <code>mcp-tool-execute</code>; the flow must answer with
    <code>mcp-tool-response</code>.</p>
    <dl>
        <dt>Tool Name</dt>
        <dd>MCP tool name: lowercase letters, digits and underscores, starting with a letter.</dd>
        <dt>Endpoint</dt>
        <dd>MCP path of the MCP Flow Server that offers the tool, so the binding survives copy, import
        and node replacement. <code>Shared (All MCPs)</code> exposes it on every endpoint.</dd>
        <dt>Behavior</dt>
        <dd>MCP safety annotation: read only, add only, or change, delete or send.</dd>
        <dt>Scope</dt>
        <dd>MCP open-world annotation. Public internet and external recipients are open-ended.</dd>
        <dt>Input Schema</dt>
        <dd>JSON Schema object for the tool arguments.</dd>
        <dt>Output Schema</dt>
        <dd>Optional JSON Schema object for the structured result.</dd>
    </dl>
    <h3>References</h3>
    <ul>
        <li><a href="https://modelcontextprotocol.io/specification">Model Context Protocol specification</a></li>
    </ul>
</script>
