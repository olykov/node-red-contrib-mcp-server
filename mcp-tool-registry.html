<script type="text/javascript">
    RED.nodes.registerType('mcp-tool-registry', {
        category: 'mcp',
        color: '#E91E63',
        defaults: {
            name: { value: '' },
            toolName: { value: '', required: true },
            toolDescription: { value: '' },
            endpoint: { value: '', required: false },
            requiredScopes: { value: '' },
            toolSchema: { value: '{\n  "type": "object",\n  "properties": {},\n  "required": []\n}' },
            autoRegister: { value: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-plus',
        label: function() {
            return this.name || this.toolName || 'Tool Registry';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            var endpointSelect = $('#node-input-endpoint');
            var currentEndpoint = this.endpoint || '';
            endpointSelect.empty();
            endpointSelect.append($('<option></option>').attr('value', '').text('All MCP endpoints'));
            if (RED.nodes && typeof RED.nodes.eachNode === 'function') {
                RED.nodes.eachNode(function(node) {
                    if (node.type !== 'mcp-flow-server') return;
                    var label = node.name || node.serverName || node.id;
                    endpointSelect.append($('<option></option>').attr('value', node.id).text(label));
                });
            }
            endpointSelect.val(currentEndpoint);

            var schemaTemplates = {
                simple: {
                    name: 'Simple Parameters',
                    schema: '{\n  "type": "object",\n  "properties": {\n    "input": {\n      "type": "string",\n      "description": "Input parameter"\n    }\n  },\n  "required": ["input"]\n}'
                },
                message: {
                    name: 'Message Tool',
                    schema: '{\n  "type": "object",\n  "properties": {\n    "message": {\n      "type": "string",\n      "description": "Message to process"\n    },\n    "category": {\n      "type": "string",\n      "description": "Optional category"\n    },\n    "priority": {\n      "type": "string",\n      "enum": ["low", "medium", "high"],\n      "description": "Priority level"\n    }\n  },\n  "required": ["message"]\n}'
                },
                calculator: {
                    name: 'Calculator Tool',
                    schema: '{\n  "type": "object",\n  "properties": {\n    "operation": {\n      "type": "string",\n      "enum": ["add", "subtract", "multiply", "divide"],\n      "description": "Mathematical operation"\n    },\n    "a": {\n      "type": "number",\n      "description": "First number"\n    },\n    "b": {\n      "type": "number",\n      "description": "Second number"\n    }\n  },\n  "required": ["operation", "a", "b"]\n}'
                },
                api: {
                    name: 'API Call Tool',
                    schema: '{\n  "type": "object",\n  "properties": {\n    "url": {\n      "type": "string",\n      "description": "API endpoint URL"\n    },\n    "method": {\n      "type": "string",\n      "enum": ["GET", "POST", "PUT", "DELETE"],\n      "description": "HTTP method"\n    },\n    "data": {\n      "type": "object",\n      "description": "Request payload"\n    }\n  },\n  "required": ["url"]\n}'
                }
            };

            var templateSelect = $('#schema-templates');
            Object.keys(schemaTemplates).forEach(function(key) {
                templateSelect.append($('<option></option>').attr('value', key).text(schemaTemplates[key].name));
            });

            $('#load-template-btn').click(function() {
                var selectedTemplate = $('#schema-templates').val();
                if (selectedTemplate && schemaTemplates[selectedTemplate]) {
                    $('#node-input-toolSchema').val(schemaTemplates[selectedTemplate].schema);
                    RED.notify('Loaded ' + schemaTemplates[selectedTemplate].name + ' template', 'success');
                }
            });

            $('#node-input-name').on('input', function() {
                var name = $(this).val();
                if (name && !$('#node-input-toolName').val()) {
                    var toolName = name.toLowerCase()
                        .replace(/[^a-z0-9\s]/g, '')
                        .replace(/\s+/g, '_');
                    $('#node-input-toolName').val(toolName);
                }
            });

            $('#node-input-toolSchema').on('blur', function() {
                var schema = $(this).val();
                try {
                    var parsed = JSON.parse(schema);
                    $(this).removeClass('input-error');
                    $('#schema-validation').hide();
                    if (!parsed.type || !parsed.properties) {
                        $('#schema-validation').show().css('color', '#f39c12').text("Warning: schema should have 'type' and 'properties' fields");
                    }
                } catch (error) {
                    $(this).addClass('input-error');
                    $('#schema-validation').show().css('color', '#e74c3c').text('Invalid JSON: ' + error.message);
                }
            });

            $('#format-schema-btn').click(function() {
                var schema = $('#node-input-toolSchema').val();
                try {
                    $('#node-input-toolSchema').val(JSON.stringify(JSON.parse(schema), null, 2));
                    RED.notify('Schema formatted', 'success');
                } catch (error) {
                    RED.notify('Invalid JSON: ' + error.message, 'error');
                }
            });

            $('#generate-message-tool-btn').click(function() {
                $('#node-input-name').val('Process Message');
                $('#node-input-toolName').val('process_message');
                $('#node-input-toolDescription').val('Process a message with optional category and priority');
                $('#node-input-toolSchema').val(schemaTemplates.message.schema);
                RED.notify('Message tool template created', 'success');
            });

            $('#generate-calc-tool-btn').click(function() {
                $('#node-input-name').val('Calculator');
                $('#node-input-toolName').val('calculate');
                $('#node-input-toolDescription').val('Perform mathematical calculations');
                $('#node-input-toolSchema').val(schemaTemplates.calculator.schema);
                RED.notify('Calculator tool template created', 'success');
            });

            $('#node-input-toolName').on('input', function() {
                var toolName = $(this).val();
                var isValid = /^[a-z][a-z0-9_]*$/.test(toolName);
                if (toolName && !isValid) {
                    $(this).addClass('input-error');
                    $('#tool-name-validation').show().text('Tool name must use lowercase letters, numbers, and underscores.');
                } else {
                    $(this).removeClass('input-error');
                    $('#tool-name-validation').hide();
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="mcp-tool-registry">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Display Name</label>
        <input type="text" id="node-input-name" placeholder="Human-readable tool name">
    </div>

    <div class="form-row">
        <label for="node-input-toolName"><i class="fa fa-cog"></i> Tool Name</label>
        <input type="text" id="node-input-toolName" placeholder="my_custom_tool">
        <div id="tool-name-validation" class="mcp-validation"></div>
    </div>

    <div class="form-row">
        <label for="node-input-toolDescription"><i class="fa fa-info-circle"></i> Description</label>
        <textarea id="node-input-toolDescription" rows="2" placeholder="Describe what this tool does"></textarea>
    </div>

    <div class="form-row">
        <label for="node-input-endpoint"><i class="fa fa-sitemap"></i> Endpoint</label>
        <select id="node-input-endpoint"></select>
        <div class="mcp-help-text">Leave empty to expose the tool on every MCP endpoint.</div>
    </div>

    <div class="form-row">
        <label for="node-input-requiredScopes"><i class="fa fa-lock"></i> Required Scopes</label>
        <input type="text" id="node-input-requiredScopes" placeholder="resource:read">
        <div class="mcp-help-text">Space- or comma-separated scopes added to this tool descriptor.</div>
    </div>

    <hr>
    <h4>Parameter Schema</h4>

    <div class="form-row">
        <label for="schema-templates"><i class="fa fa-magic"></i> Schema Templates</label>
        <select id="schema-templates">
            <option value="">Select a template</option>
        </select>
        <button type="button" id="load-template-btn" class="btn btn-secondary mcp-button-row">
            <i class="fa fa-download"></i> Load Template
        </button>
    </div>

    <div class="form-row">
        <label for="node-input-toolSchema"><i class="fa fa-code"></i> JSON Schema</label>
        <textarea id="node-input-toolSchema" rows="8" placeholder='{"type": "object", "properties": {}, "required": []}'></textarea>
        <div id="schema-validation" class="mcp-validation"></div>
        <button type="button" id="format-schema-btn" class="btn btn-secondary mcp-button-row">
            <i class="fa fa-magic"></i> Format JSON
        </button>
    </div>

    <div class="form-row">
        <label for="node-input-autoRegister"><i class="fa fa-play"></i> Auto Register</label>
        <input type="checkbox" id="node-input-autoRegister" style="width: auto;">
    </div>

    <hr>
    <h4>Quick Tool Generation</h4>

    <div class="form-row">
        <label></label>
        <button type="button" id="generate-message-tool-btn" class="btn btn-primary" style="margin-right: 10px;">
            <i class="fa fa-check-square-o"></i> Message Tool
        </button>
        <button type="button" id="generate-calc-tool-btn" class="btn btn-primary">
            <i class="fa fa-calculator"></i> Calculator Tool
        </button>
    </div>

    <style>
        .mcp-help-text {
            margin-top: 5px;
            font-size: 12px;
            color: var(--red-ui-secondary-text-color, #666);
        }
        .mcp-validation {
            display: none;
            margin-top: 5px;
            font-size: 12px;
        }
        .mcp-button-row {
            margin-top: 5px;
        }
    </style>
</script>

<script type="text/html" data-help-name="mcp-tool-registry">
    <p>Defines and registers an MCP tool for one endpoint or every endpoint.</p>
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Tool Name <span class="property-type">string</span></dt>
        <dd>MCP tool name. Use lowercase letters, numbers, and underscores.</dd>
        <dt>Endpoint <span class="property-type">mcp-flow-server</span></dt>
        <dd>Optional endpoint binding. Empty makes the tool shared across all endpoints.</dd>
        <dt>Required Scopes <span class="property-type">string</span></dt>
        <dd>Scopes added to this tool descriptor in addition to endpoint base scopes.</dd>
        <dt>JSON Schema <span class="property-type">JSON</span></dt>
        <dd>JSON Schema defining the tool input parameters.</dd>
        <dt>Auto Register <span class="property-type">boolean</span></dt>
        <dd>Register the tool when Node-RED starts.</dd>
    </dl>
    <h3>Runtime</h3>
    <p>The registry node advertises the tool. The flow still has to return a matching <code>mcp-tool-response</code> for calls to complete.</p>
</script>
