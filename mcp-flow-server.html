<script type="text/javascript">
    RED.nodes.registerType('mcp-runtime', {
        category: 'config',
        defaults: {
            name: { value: '' },
            runtimeName: { value: 'mcp-runtime', required: true },
            serverPort: { value: 8001, required: true, validate: function(v) {
                return RED.validators.number()(v) && Number.isInteger(Number(v)) && v > 0 && v < 65536;
            } },
            publicBaseUrl: { value: '' },
            adminPort: { value: 1880, required: false, validate: function(v) {
                return v === '' || (RED.validators.number()(v) && Number.isInteger(Number(v)) && v > 0 && v < 65536);
            } },
            adminEndpointPath: { value: '' }
        },
        credentials: {
            adminToken: { type: 'password' }
        },
        paletteLabel: 'MCP runtime',
        label: function() {
            return this.name || this.runtimeName || 'MCP Runtime';
        }
    });

    RED.nodes.registerType('mcp-flow-server', {
        category: 'mcp',
        color: '#D8BFD8',
        defaults: {
            name: { value: '' },
            runtime: { value: '', type: 'mcp-runtime', required: true },
            auth: { value: '', type: 'mcp-auth', required: true },
            serverName: { value: 'node-red-mcp-server', required: true },
            serverPath: { value: '/mcp', required: true },
            allowedGroups: { value: '' }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'MCP flow server',
        inputLabels: 'mcp-tool-response or command',
        outputLabels: 'Tool calls (mcp-tool-execute)',
        icon: 'font-awesome/fa-cogs',
        label: function() {
            return this.name || 'MCP Flow Server';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            function loadFlowServers() {
                $.ajax({ url: 'mcp-flow-servers', method: 'GET', timeout: 5000 })
                    .done(function(data) {
                        var statusDiv = $('#flow-servers-status').empty();
                        if (data.servers && data.servers.length > 0) {
                            $('<h5>').text('Running Flow Servers:').appendTo(statusDiv);
                            var list = $('<ul>').appendTo(statusDiv);
                            data.servers.forEach(function(server) {
                                var status = server.isRunning ? 'running' : 'stopped';
                                $('<li>').text(status + ' ' + server.serverName + ' ' + (server.path || '/mcp') +
                                    ' (port ' + server.port + ') - ' + server.toolCount + ' tools').appendTo(list);
                            });
                        } else {
                            $('<p>').text('No flow servers currently running').appendTo(statusDiv);
                        }
                    })
                    .fail(function() {
                        $('#flow-servers-status').empty().append($('<p>').text('Failed to load flow server status'));
                    });
            }

            $('#refresh-status-btn').on('click', loadFlowServers);
            setTimeout(loadFlowServers, 500);
        }
    });
</script>

<script type="text/html" data-help-name="mcp-runtime">
    <p>Local MCP HTTP listener shared by one or more MCP Flow Server endpoints.</p>
    <h3>Details</h3>
    <p>Several endpoints may share one runtime port when their MCP paths differ.
    The runtime also hosts the OAuth routes of the auth configurations used by its endpoints.</p>
    <dl>
        <dt>Port</dt>
        <dd>Local HTTP port of the listener.</dd>
        <dt>Base URL</dt>
        <dd>Client-facing base URL used in OAuth metadata and challenges, directly or through a proxy.
        It may be reachable only over VPN. If empty, request headers are used.</dd>
        <dt>Admin Port</dt>
        <dd>Local Node-RED Admin API port used by the read-only admin tools.</dd>
        <dt>Admin Token</dt>
        <dd>Bearer token for the local Node-RED Admin API, stored as a credential.
        <code>NODE_RED_ADMIN_API_TOKEN</code> takes precedence when set.</dd>
        <dt>Admin Path</dt>
        <dd>Exact MCP path allowed to expose the read-only admin tools.</dd>
    </dl>
    <p>Admin tools are exposed only when Admin Port, a token and Admin Path are set and an
    MCP Flow Server on this runtime uses exactly that path.</p>
    <h3>References</h3>
    <ul>
        <li><a href="https://modelcontextprotocol.io/specification">Model Context Protocol specification</a></li>
    </ul>
</script>

<script type="text/html" data-help-name="mcp-flow-server">
    <p>One MCP endpoint on a selected runtime. Tool calls are passed into the flow and answered
    from the flow.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd><code>mcp-tool-response</code> to answer a tool call, or a command:
        <code>start</code>, <code>stop</code> or <code>restart</code>. Commands produce no output.</dd>
        <dt class="optional">payload.executionId <span class="property-type">string</span></dt>
        <dd>For <code>mcp-tool-response</code>: the id received in the tool call.</dd>
        <dt class="optional">payload.result <span class="property-type">any</span></dt>
        <dd>Tool result: an MCP result object, content array, string or JSON value.</dd>
        <dt class="optional">payload.error <span class="property-type">string</span></dt>
        <dd>Error text; the tool call fails with this message.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>topic <span class="property-type">string</span></dt>
        <dd>Always <code>mcp-tool-execute</code>.</dd>
        <dt>payload <span class="property-type">object</span></dt>
        <dd><code>toolName</code>, <code>arguments</code> and <code>executionId</code>.</dd>
    </dl>
    <h3>Details</h3>
    <p>The output carries only tool calls. Endpoint state is shown in the node status; tool
    telemetry comes from the MCP metrics node. Every tool call requires OAuth; discovery
    (<code>initialize</code>, <code>tools/list</code>) stays visible. A call fails after 30 seconds without a matching
    <code>mcp-tool-response</code>.</p>
    <dl>
        <dt>Runtime</dt>
        <dd>MCP runtime that listens on a port and hosts this endpoint path.</dd>
        <dt>Auth</dt>
        <dd>Required MCP auth configuration.</dd>
        <dt>MCP Name</dt>
        <dd>Name returned in MCP initialize responses.</dd>
        <dt>MCP Path</dt>
        <dd>HTTP JSON-RPC path, for example <code>/mcp/ops</code>. Only POST is served.</dd>
        <dt>Groups</dt>
        <dd>Optional groups separated by commas or spaces. A user needs at least one of them.</dd>
    </dl>
    <h3>References</h3>
    <ul>
        <li><a href="https://modelcontextprotocol.io/specification">Model Context Protocol specification</a></li>
    </ul>
</script>
