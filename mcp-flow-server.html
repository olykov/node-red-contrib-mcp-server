<script type="text/javascript">
    RED.nodes.registerType('mcp-runtime', {
        category: 'config',
        defaults: {
            name: { value: '' },
            runtimeName: { value: 'mcp-runtime', required: true },
            serverPort: { value: 8001, required: true, validate: function(v) { return v > 0 && v < 65536; } },
            publicBaseUrl: { value: '' },
            autoStart: { value: false },
            enableCors: { value: true },
            adminPort: { value: 1880, required: false, validate: function(v) { return v === '' || (v > 0 && v < 65536); } },
            adminEndpointPath: { value: '' }
        },
        credentials: {
            adminToken: { type: 'password' }
        },
        label: function() {
            return this.name || this.runtimeName || 'MCP Runtime';
        }
    });

    RED.nodes.registerType('mcp-flow-server', {
        category: 'mcp',
        color: '#9C27B0',
        defaults: {
            name: { value: '' },
            runtime: { value: '', type: 'mcp-runtime', required: true },
            auth: { value: '', type: 'mcp-auth', required: false },
            serverName: { value: 'node-red-mcp-server', required: true },
            serverPath: { value: '/mcp', required: true },
            authMode: { value: 'inherit' },
            allowedGroups: { value: '' },
            requiredScopes: { value: '' },
            advertisedScopes: { value: '' }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: function(index) {
            return index === 0 ? 'Tool execution and status' : 'Admin tool telemetry';
        },
        icon: 'font-awesome/fa-cogs',
        label: function() {
            return this.name || 'MCP Flow Server';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            function loadFlowServers() {
                $.ajax({ url: 'mcp-flow-servers', method: 'GET', timeout: 5000 })
                    .done(function(data) {
                        var statusDiv = $('#flow-servers-status');
                        if (data.servers && data.servers.length > 0) {
                            var html = '<h5>Running Flow Servers:</h5><ul>';
                            data.servers.forEach(function(server) {
                                var status = server.isRunning ? 'running' : 'stopped';
                                html += '<li>' + status + ' ' + server.serverName + ' ' + (server.path || '/mcp') + ' (port ' + server.port + ') - ' + server.toolCount + ' tools</li>';
                            });
                            statusDiv.html(html + '</ul>');
                        } else {
                            statusDiv.html('<p>No flow servers currently running</p>');
                        }
                    })
                    .fail(function() {
                        $('#flow-servers-status').html('<p>Failed to load flow server status</p>');
                    });
            }

            $('#refresh-status-btn').click(loadFlowServers);
            setTimeout(loadFlowServers, 500);
        }
    });
</script>

<script type="text/html" data-help-name="mcp-runtime">
    <p>Defines a local MCP HTTP runtime shared by one or more MCP Flow Server endpoints.</p>
    <h3>Fields</h3>
    <dl class="message-properties">
        <dt>Port <span class="property-type">number</span></dt>
        <dd>Local HTTP port. Multiple MCP Flow Server nodes may share one runtime port when their MCP paths differ.</dd>
        <dt>Public Base URL <span class="property-type">string</span></dt>
        <dd>External base URL used when building OAuth metadata and challenges. If empty, request headers are used.</dd>
        <dt>Auto Start <span class="property-type">boolean</span></dt>
        <dd>Start endpoints on this runtime when Node-RED starts.</dd>
        <dt>CORS <span class="property-type">boolean</span></dt>
        <dd>Add browser CORS headers to responses from this local listener.</dd>
        <dt>Admin Port <span class="property-type">number</span></dt>
        <dd>Local Node-RED Admin API port used by read-only admin tools.</dd>
        <dt>Admin Token <span class="property-type">credential</span></dt>
        <dd>Bearer token sent to the local Node-RED Admin API. Leave empty to use <code>NODE_RED_ADMIN_API_TOKEN</code>.</dd>
        <dt>Admin Endpoint Path <span class="property-type">string</span></dt>
        <dd>Exact MCP path allowed to expose read-only admin tools.</dd>
    </dl>
    <p>Admin tools are exposed only when Admin Port, Admin Token or <code>NODE_RED_ADMIN_API_TOKEN</code>, and Admin Endpoint Path are set, and an MCP Flow Server on this runtime uses exactly that path.</p>
</script>

<script type="text/html" data-help-name="mcp-flow-server">
    <p>Defines one logical MCP endpoint on a selected local runtime and passes tool calls into Node-RED flows.</p>
    <h3>Configuration</h3>
    <dl class="message-properties">
        <dt>Runtime <span class="property-type">mcp-runtime</span></dt>
        <dd>Local HTTP runtime that listens on a port and hosts this endpoint path.</dd>
        <dt>Auth <span class="property-type">mcp-auth</span></dt>
        <dd>Optional OIDC auth configuration used when this endpoint requires OAuth.</dd>
        <dt>MCP Name <span class="property-type">string</span></dt>
        <dd>Name returned in MCP initialize responses and used for endpoint-scoped tool registration.</dd>
        <dt>MCP Path <span class="property-type">string</span></dt>
        <dd>HTTP JSON-RPC path served by this endpoint, for example <code>/internal/mcp/ops</code>.</dd>
        <dt>Auth Mode <span class="property-type">string</span></dt>
        <dd>Controls whether this endpoint is public or requires OAuth. Inherit uses the selected auth config state.</dd>
        <dt>Allowed Groups <span class="property-type">string</span></dt>
        <dd>Optional any-of group list checked against the authenticated user claims.</dd>
        <dt>Required Scopes <span class="property-type">string</span></dt>
        <dd>Optional scopes required for every tool on this endpoint.</dd>
        <dt>Base Scopes <span class="property-type">string</span></dt>
        <dd>Space- or comma-separated scopes advertised on tools exposed by this endpoint.</dd>
    </dl>
    <h3>Runtime</h3>
    <p>Output 1 sends <code>mcp-tool-execute</code> and status messages. The node waits for matching <code>mcp-tool-response</code> messages on its input.</p>
    <p>Output 2 sends one <code>mcp-admin-telemetry</code> message per admin tool call. Its payload contains a bounded tool name and mode, status, duration in milliseconds, response bytes, scanned node count, and cache state. It contains no request arguments or flow content.</p>
</script>
