<script type="text/javascript">
    RED.nodes.registerType('mcp-runtime', {
        category: 'config',
        defaults: {
            name: { value: '' },
            runtimeName: { value: 'mcp-runtime', required: true },
            serverPort: { value: 8001, required: true, validate: function(v) {
                return RED.validators.number()(v) && Number.isInteger(Number(v)) && v > 0 && v < 65536;
            } },
            publicBaseUrl: { value: '', required: true, validate: RED.validators.regex(/^https?:\/\/[^\/]+/) },
            bindHost: { value: '127.0.0.1', required: true },
            allowedOrigins: { value: '', validate: function(v) {
                return String(v || '').split(/[\s,]+/).filter(Boolean).every(function(value) {
                    try {
                        var url = new URL(value);
                        return ['http:', 'https:'].indexOf(url.protocol) !== -1 && url.origin === value &&
                            !url.username && !url.password;
                    } catch (_) { return false; }
                });
            } },
            trustedProxies: { value: '', validate: function(v) {
                return String(v || '').split(/[\s,]+/).filter(Boolean).every(function(value) {
                    return /^[0-9a-fA-F:.]+\/\d{1,3}$/.test(value);
                });
            } },
            allowFunctionCode: { value: false },
            codeGroups: { value: '', validate: function(v) {
                return !$('#node-config-input-allowFunctionCode').prop('checked') || !!String(v || '').trim();
            } },
            adminPort: { value: 1880, required: false, validate: function(v) {
                return v === '' || (RED.validators.number()(v) && Number.isInteger(Number(v)) && v > 0 && v < 65536);
            } },
            adminTokenEnv: { value: '', validate: function(v) {
                return !v || /^MCP_[A-Z0-9_]+$/.test(String(v).trim());
            } },
            adminCa: { value: '' },
            adminEndpointPath: { value: '' }
        },
        credentials: {
            adminToken: { type: 'password' }
        },
        paletteLabel: 'MCP Runtime',
        label: function() {
            return this.name || this.runtimeName || this._('mcp-runtime.label.paletteLabel');
        }
    });

    RED.nodes.registerType('mcp-flow-server', {
        category: 'mcp',
        color: '#3FADB5',
        defaults: {
            name: { value: '' },
            runtime: { value: '', type: 'mcp-runtime', required: true },
            auth: { value: '', type: 'mcp-auth', required: true },
            serverName: { value: 'node-red-mcp-server', required: true },
            serverPath: { value: '/mcp', required: true },
            allowedGroups: { value: '', required: true },
            toolTimeoutMs: { value: 30000, required: true, validate: function(v) {
                return RED.validators.number()(v) && Number.isInteger(Number(v)) && v >= 1000 && v <= 600000;
            } },
            maxConcurrentCalls: { value: 32, required: true, validate: function(v) {
                return RED.validators.number()(v) && Number.isInteger(Number(v)) && v >= 1 && v <= 1024;
            } }
        },
        inputs: 1,
        outputs: 1,
        paletteLabel: 'MCP Server',
        inputLabels: 'mcp-tool-response or command',
        outputLabels: 'Tool calls (mcp-tool-execute)',
        icon: 'font-awesome/fa-cogs',
        label: function() {
            return this.name || this._('mcp-flow-server.label.paletteLabel');
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        },
        oneditprepare: function() {
            var node = this;
            function loadFlowServers() {
                $.ajax({ url: 'mcp-flow-servers', method: 'GET', timeout: 5000 })
                    .done(function(data) {
                        var statusDiv = $('#flow-servers-status').empty();
                        if (data.servers && data.servers.length > 0) {
                            $('<h5>').text(node._('mcp-flow-server.label.statusRunningHeading')).appendTo(statusDiv);
                            var list = $('<ul>').appendTo(statusDiv);
                            data.servers.forEach(function(server) {
                                var status = server.isRunning ?
                                    node._('mcp-flow-server.label.statusRunning') : node._('mcp-flow-server.label.statusStopped');
                                $('<li>').text(status + ' ' + server.serverName + ' ' + (server.path || '/mcp') +
                                    ' (port ' + server.port + ') - ' + server.toolCount + ' tools').appendTo(list);
                            });
                        } else {
                            $('<p>').text(node._('mcp-flow-server.label.statusNone')).appendTo(statusDiv);
                        }
                    })
                    .fail(function() {
                        $('#flow-servers-status').empty().append($('<p>').text(node._('mcp-flow-server.label.statusFetchFailed')));
                    });
            }

            $('#refresh-status-btn').on('click', loadFlowServers);
            setTimeout(loadFlowServers, 500);
        }
    });
</script>
