name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers and the npm trusted publisher
    # (repository, workflow release.yml, environment npm) on npmjs.com.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # No token: authentication and provenance come from the GitHub OIDC identity.
      - run: npm publish --provenance --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
