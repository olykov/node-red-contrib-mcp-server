<script type="text/javascript">
    RED.nodes.registerType('mcp-server-metrics', {
        category: 'mcp',
        color: '#9C27B0',
        defaults: {
            name: { value: '' },
            runtime: { value: '', type: 'mcp-runtime', required: true }
        },
        inputs: 0,
        outputs: 1,
        outputLabels: 'Tool telemetry',
        icon: 'font-awesome/fa-line-chart',
        label: function() {
            return this.name || 'MCP Server Metrics';
        },
        labelStyle: function() {
            return this.name ? 'node_label_italic' : '';
        }
    });
</script>

<script type="text/html" data-template-name="mcp-server-metrics">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="MCP Server Metrics">
    </div>
    <div class="form-row">
        <label for="node-input-runtime"><i class="fa fa-sitemap"></i> Runtime</label>
        <input type="text" id="node-input-runtime">
    </div>
</script>

<script type="text/html" data-help-name="mcp-server-metrics">
    <p>Emits one message after each tool call on the selected MCP runtime, including failed calls. Use one metrics node per runtime.</p>
    <p>The output message has topic <code>mcp-tool-telemetry</code>. Its payload contains the endpoint name, known tool name (or <code>unknown</code>), mode, status, duration in milliseconds, response bytes, and optional admin-tool scan and cache data. It does not contain tool arguments, responses, credentials, or flow content.</p>
    <p>Connect this output to metric writer nodes. This node does not poll the server or expose a metrics endpoint.</p>
</script>
