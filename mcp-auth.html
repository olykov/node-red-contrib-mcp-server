<script type="text/javascript">
    // properties.md: validators read the edit dialog first and fall back to the saved node.
    function mcpRedisMode(node) {
        var input = $('#node-config-input-mode');
        return input.length ? input.val() : node.mode;
    }
    function mcpAuthProvider(node) {
        var input = $('#node-config-input-provider');
        return input.length && input.val() ? input.val() : node.provider;
    }

    RED.nodes.registerType('mcp-redis', {
        category: 'config',
        defaults: {
            name: { value: '' },
            mode: { value: 'memory', required: true, validate: function(v) { return ['memory', 'env', 'manual'].indexOf(v) !== -1; } },
            redisUrlEnv: { value: 'MCP_REDIS_URL', validate: function(v) {
                return mcpRedisMode(this) !== 'env' || /^MCP_[A-Z0-9_]+$/.test(v || '');
            } },
            host: { value: '127.0.0.1', validate: function(v) { return mcpRedisMode(this) !== 'manual' || !!(v && String(v).trim()); } },
            port: { value: 6379, validate: function(v) {
                return v === '' || (RED.validators.number()(v) && Number.isInteger(Number(v)) && v > 0 && v < 65536);
            } },
            db: { value: 0, validate: function(v) {
                return v === '' || (RED.validators.number()(v) && Number.isInteger(Number(v)) && v >= 0);
            } },
            tls: { value: false },
            username: { value: '' },
            passwordEnv: { value: '', validate: function(v) { return !v || /^MCP_[A-Z0-9_]+$/.test(v); } },
            keyPrefix: { value: 'mcp_auth:' }
        },
        credentials: {
            password: { type: 'password' }
        },
        paletteLabel: 'MCP Auth Storage',
        label: function() {
            return this.name || 'MCP Auth Storage';
        },
        oneditprepare: function() {
            function updateMode() {
                var mode = $('#node-config-input-mode').val();
                $('.mcp-redis-env-row').toggle(mode === 'env');
                $('.mcp-redis-manual-row').toggle(mode === 'manual');
                $('.mcp-redis-memory-note').toggle(mode === 'memory');
            }
            $('#node-config-input-mode').on('change', updateMode);
            updateMode();
        }
    });

    RED.nodes.registerType('mcp-auth', {
        category: 'config',
        defaults: {
            name: { value: '' },
            oauthSlug: { value: '', required: true, validate: function(v) { return typeof v === 'string' && /^[a-z][a-z0-9-]{0,62}$/.test(v); } },
            provider: { value: 'oidc', required: true, validate: function(v) { return v === 'oidc' || v === 'microsoft'; } },
            issuerUrl: { value: '', validate: function(v) {
                if (mcpAuthProvider(this) !== 'oidc') return true;
                try { var u = new URL(v); return u.protocol === 'https:' && !u.username && !u.password && !u.search && !u.hash; }
                catch (_) { return false; }
            } },
            clientId: { value: '', validate: function(v) { return mcpAuthProvider(this) !== 'oidc' || (typeof v === 'string' && v.trim().length > 0); } },
            clientSecretEnv: { value: '', validate: function(v) {
                return mcpAuthProvider(this) !== 'oidc' || !v || /^MCP_[A-Z0-9_]+$/.test(v);
            } },
            microsoftTenantId: { value: '', validate: function(v) { return mcpAuthProvider(this) !== 'microsoft' || /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v); } },
            microsoftClientId: { value: '', validate: function(v) { return mcpAuthProvider(this) !== 'microsoft' || /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v); } },
            microsoftClientSecretEnv: { value: '', validate: function(v) {
                return mcpAuthProvider(this) !== 'microsoft' || !v || /^MCP_[A-Z0-9_]+$/.test(v);
            } },
            allowedClientHosts: { value: '', required: true },
            groupClaim: { value: 'groups' },
            userClaim: { value: 'email' },
            redis: { value: '', type: 'mcp-redis', required: true },
            accessTokenTtl: { value: 900, validate: function(v) { return Number.isInteger(Number(v)) && v > 0 && v <= 900; } },
            refreshTokenTtl: { value: 604800, validate: function(v) { return Number.isInteger(Number(v)) && v > 0 && v <= 604800; } },
            sessionTtl: { value: 1814400, validate: function(v) { return Number.isInteger(Number(v)) && v > 0 && v <= 1814400; } }
        },
        credentials: {
            clientSecret: { type: 'password' },
            microsoftClientSecret: { type: 'password' },
            oidcRefreshKey: { type: 'password' },
            microsoftRefreshKey: { type: 'password' }
        },
        paletteLabel: 'MCP Auth',
        label: function() {
            return this.name || 'MCP OIDC Auth';
        },
        oneditprepare: function() {
            var tabs = RED.tabs.create({
                id: 'mcp-auth-provider-tabs',
                onchange: function(tab) {
                    $('#node-config-input-provider').val(tab.id);
                    $('.mcp-auth-provider-panel').hide();
                    $('#mcp-auth-' + tab.id).show();
                }
            });
            tabs.addTab({ id: 'microsoft', label: 'Microsoft Entra ID' });
            tabs.addTab({ id: 'oidc', label: 'OIDC' });
            tabs.activateTab(this.provider || 'oidc');

            function updateRedirectUrl() {
                var slug = $('#node-config-input-oauthSlug').val();
                var text = /^[a-z][a-z0-9-]{0,62}$/.test(slug || '') ?
                    'Redirect URL: https://<nodered>/oauth/' + slug + '/callback' :
                    'Redirect URL: unavailable (invalid slug)';
                $('#mcp-auth-redirect-url').text(text);
            }
            $('#node-config-input-oauthSlug').on('input', updateRedirectUrl);
            updateRedirectUrl();
        }
    });
</script>

<script type="text/html" data-help-name="mcp-redis">
    <p>Storage for MCP authorization state, authorization codes, access tokens and refresh sessions.</p>
    <h3>Details</h3>
    <dl>
        <dt>Mode</dt>
        <dd><code>Memory</code> for local tests only: every restart or deploy clears all sessions, so
        users sign in again. <code>Redis URL from environment</code> or
        <code>Manual Redis settings</code> keep sessions across restarts.</dd>
        <dt>URL Env</dt>
        <dd>Environment variable holding the Redis URL, default <code>MCP_REDIS_URL</code>.</dd>
        <dt>Host, Port, DB, TLS, Username</dt>
        <dd>Manual Redis connection settings.</dd>
        <dt>Password, Password Env</dt>
        <dd>Redis password as a credential, or the name of an environment variable that holds it.</dd>
        <dt>Environment variable names</dt>
        <dd>Must start with <code>MCP_</code>, so a configuration cannot read other process secrets.</dd>
        <dt>Key Prefix</dt>
        <dd>Prefix for every stored key.</dd>
    </dl>
    <p>Connection errors are reported as warnings at most once a minute.</p>
</script>

<script type="text/html" data-help-name="mcp-auth">
    <p>OAuth authorization for MCP endpoints, backed by Microsoft Entra ID or another OIDC provider.</p>
    <h3>Details</h3>
    <p>The selected provider tab is active. Secrets are stored as credentials or read from
    environment variables whose names start with <code>MCP_</code>. An invalid configuration is reported in the log and every endpoint that
    uses it refuses to start.</p>
    <dl>
        <dt>Slug</dt>
        <dd>Stable OAuth route name. Register
        <code>https://your-nodered-host/oauth/your-slug/callback</code> with the provider. Slugs
        must be unique across separate auth configurations on the same listener or base URL.</dd>
        <dt>Microsoft Entra ID</dt>
        <dd>Single-tenant v2 issuer from Tenant ID; roles from the verified ID token; scopes
        <code>openid profile email</code>. At least one app role is required.</dd>
        <dt>OIDC</dt>
        <dd>Configured issuer, UserInfo groups and scopes <code>openid profile email groups</code>.</dd>
        <dt>Refresh Key</dt>
        <dd>64 hex characters (<code>openssl rand -hex 32</code>) that encrypt stored provider
        refresh tokens. Without it no refresh tokens are issued.</dd>
        <dt>Client Hosts</dt>
        <dd>Hosts allowed to serve MCP client metadata documents, for example <code>claude.ai</code>.</dd>
        <dt>Storage</dt>
        <dd>MCP auth storage; use Redis for sessions that must survive restarts.</dd>
        <dt>Access TTL, Refresh TTL, Session TTL</dt>
        <dd>Seconds. Access tokens last at most 15 minutes, refresh sessions expire after at most 7 idle
        days and at most 21 days in total; refresh never extends the total. An identical refresh
        retry within 30 seconds gets the same result; provider outages answer
        <code>temporarily_unavailable</code> without revoking the session.</dd>
    </dl>
    <p>Sessions belong to the provider identity and slug, not to this node's ID: a replacement
    node with the same settings keeps users signed in. Changing provider, issuer, client ID,
    group claim or slug, or switching storage, ends all existing sessions.</p>
    <h3>References</h3>
    <ul>
        <li><a href="https://datatracker.ietf.org/doc/html/rfc6749">RFC 6749 OAuth 2.0</a></li>
        <li><a href="https://modelcontextprotocol.io/specification">Model Context Protocol authorization</a></li>
    </ul>
</script>
