
<script type="text/html" data-help-name="nr-mcp-runtime">
    <p>Local MCP HTTP listener shared by one or more MCP endpoints.</p>
    <h3>Details</h3>
    <p>Several endpoints may share one runtime port when their MCP paths differ.
    The runtime also hosts the OAuth routes of the auth configurations used by its endpoints.</p>
    <dl>
        <dt>Port</dt>
        <dd>Local HTTP port of the listener.</dd>
        <dt>Base URL</dt>
        <dd>Required. Client-facing base URL used in OAuth metadata and challenges, directly or through
        a proxy. It may be reachable only over VPN. Endpoints do not start without it.</dd>
        <dt>Bind Host</dt>
        <dd>Address used by the listener. New runtimes default to <code>127.0.0.1</code>; set an
        explicit address when remote clients must connect.</dd>
        <dt>Allowed Origins</dt>
        <dd>Exact browser origins in addition to the Base URL origin. Requests without an
        <code>Origin</code> header are not restricted by this setting.</dd>
        <dt>Trusted Proxies</dt>
        <dd>CIDR ranges of trusted reverse proxies. Forwarded client addresses are used in audit
        logs only when the TCP peer is in this list.</dd>
        <dt>Allow Function Code</dt>
        <dd>When enabled, Function code may be returned by <code>get_flow</code> only to users
        in Code Groups. Code is sent to the MCP client and secrets in code are not redacted.</dd>
        <dt>Admin Port</dt>
        <dd>Fallback port for the local Node-RED Admin API; the runtime uses Node-RED's configured
        UI port, host, HTTP admin root and HTTPS setting when available. When Node-RED itself serves
        HTTPS with a certificate from a private CA, start Node-RED with
        <code>NODE_EXTRA_CA_CERTS</code> set to that CA file.</dd>
        <dt>Admin Token</dt>
        <dd>Bearer token for the local Node-RED Admin API, stored as a credential.</dd>
        <dt>Admin Token Env</dt>
        <dd>Optional <code>MCP_*</code> environment variable for the API token. The Admin Token
        credential takes precedence.</dd>
        <dt>Admin Path</dt>
        <dd>Exact MCP path allowed to expose the read-only admin tools.</dd>
    </dl>
    <p>Admin tools are exposed only when a token and Admin Path are set and an MCP Endpoint on this
    runtime uses exactly that path.</p>
    <p>An empty Bind Host listens on all interfaces and logs a warning.</p>
    <h3>References</h3>
    <ul>
        <li><a href="https://modelcontextprotocol.io/specification">Model Context Protocol specification</a></li>
    </ul>
</script>

<script type="text/html" data-help-name="nr-mcp-endpoint">
    <p>Configuration of one MCP endpoint on a selected runtime. MCP Tool nodes select it and their
    flows answer its tool calls.</p>
    <h3>Details</h3>
    <p>The endpoint starts when flows start and has no wires or commands; deploy or disable its
    tools to change what it serves. A configuration error or an unavailable port is logged and shown
    as <code>endpoint error</code> on its tools. Tool telemetry comes from the MCP metrics node. The
    endpoint speaks MCP 2025-06-18 and 2025-11-25 (after <code>initialize</code>) and 2026-07-28
    (without a handshake); every request, <code>initialize</code> and <code>server/discover</code>
    included, requires OAuth. Notifications return HTTP 202 without a
    body, and closing the connection cancels a running tool call.</p>
    <dl>
        <dt>Runtime</dt>
        <dd>MCP runtime that listens on a port and hosts this endpoint path.</dd>
        <dt>Auth</dt>
        <dd>Required MCP auth configuration.</dd>
        <dt>MCP Name</dt>
        <dd>Server name reported in <code>serverInfo</code> of every result.</dd>
        <dt>MCP Path</dt>
        <dd>HTTP JSON-RPC path, for example <code>/mcp/ops</code>. Only POST is served.</dd>
        <dt>Groups</dt>
        <dd>Required groups separated by commas; a group name may contain spaces. A user needs at least one of them; an
        endpoint without groups does not start.</dd>
        <dt>Tool Timeout</dt>
        <dd>Execution deadline in milliseconds (1000-600000). Timed out flow calls return an MCP
        result with <code>isError: true</code>.</dd>
        <dt>Max Concurrent Calls</dt>
        <dd>Maximum simultaneous tool executions (1-1024); excess calls receive JSON-RPC error
        <code>-32000</code>.</dd>
    </dl>
    <h3>References</h3>
    <ul>
        <li><a href="https://modelcontextprotocol.io/specification">Model Context Protocol specification</a></li>
    </ul>
</script>
